<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENDO-TWIN NEXUS — Unified Workstation</title>
<meta name="description" content="ENDO-TWIN NEXUS unified workstation — patient and doctor views in one console. Research prototype, not a medical device.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="app-root">
  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <button class="icon-btn menu-btn" id="btnMenu" title="Menu">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div class="brand-text">
        <div class="brand-title">ENDO-TWIN NEXUS</div>
        <div class="brand-sub">Sense • Model • Predict • Personalize</div>
      </div>
    </div>

    <div class="searchbar" id="searchBar">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="globalSearch" type="text" placeholder="Search anything (symptoms, reports, patients, doctors, research…)" autocomplete="off">
      <span class="kbd">Ctrl + K</span>
      <div class="search-results" id="searchResults"></div>
    </div>

    <button class="ds-chip" id="dsChip" title="Where this screen's data comes from">
      <span class="ds-dot"></span><span class="ds-text" id="dsText">CHECKING…</span>
    </button>

    <div class="device-pill" id="devicePill" title="Wearable link status — click to open the device console" role="button" tabindex="0">
      <span class="dot live"></span>
      <div class="device-text">
        <div class="device-title" id="deviceLabel">Wearable Connected</div>
        <div class="device-sub" id="deviceSub">ESP32-S3 • 85%</div>
      </div>
      <svg class="ic wifi" viewBox="0 0 24 24"><path d="M2 8.8a16 16 0 0 1 20 0"/><path d="M5 12.4a11 11 0 0 1 14 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.2" fill="currentColor"/></svg>
      <svg class="ic batt" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
    </div>

    <div class="clock">
      <div class="clock-date" id="clockDate">—</div>
      <div class="clock-time" id="clockTime">—</div>
    </div>

    <button class="icon-btn" id="btnNotify" title="Notifications">
      <svg class="ic" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="notifyBadge">3</span>
    </button>

    <button class="icon-btn" id="btnTheme" title="Toggle light / dark">
      <svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>

    <!-- ROLE / PROFILE SWITCHER -->
    <div class="profile-switch" id="profileSwitch">
      <div class="avatar" id="topAvatar">A</div>
      <div class="profile-text">
        <div class="profile-name" id="topName">Aviral</div>
        <div class="profile-role" id="topRole">Patient View</div>
      </div>
      <svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      <div class="switch-menu" id="switchMenu"></div>
    </div>
  </header>

  <div class="shell">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <nav id="navList"></nav>
      <div class="sidebar-foot">
        <div class="disclaimer-mini">Research prototype — not a medical device, not a diagnosis.</div>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/device.js"></script>
<script src="assets/js/views-patient.js"></script>
<script src="assets/js/views-doctor.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
