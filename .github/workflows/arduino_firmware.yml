name: Active firmware quality gate

on:
  push:
    paths:
      - 'hardware/esp8266/**'
      - 'hardware/arduino/endo_twin_mega_lab/**'
      - 'scripts/build/build_firmware.sh'
      - '.github/workflows/arduino_firmware.yml'
  pull_request:
    paths:
      - 'hardware/esp8266/**'
      - 'hardware/arduino/endo_twin_mega_lab/**'
      - 'scripts/build/build_firmware.sh'
      - '.github/workflows/arduino_firmware.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install active cores
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp8266:esp8266
      - name: Install sensor libraries
        run: |
          arduino-cli lib install 'SparkFun MAX3010x Pulse and Proximity Sensor Library'
          arduino-cli lib install 'Adafruit MPU6050'
          arduino-cli lib install 'Adafruit Unified Sensor'
          arduino-cli lib install 'OneWire'
          arduino-cli lib install 'DallasTemperature'
          arduino-cli lib install 'BH1750'
          arduino-cli lib install 'Adafruit BME280 Library'
          arduino-cli lib install 'Adafruit GFX Library'
          arduino-cli lib install 'Adafruit SSD1306'
      - name: Compile ESP8266 primary wearable
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --export-binaries 'hardware/esp8266/endo_twin_wearable'
      - name: Compile Arduino Mega bench/lab
        run: arduino-cli compile --fqbn arduino:avr:mega --export-binaries 'hardware/arduino/endo_twin_mega_lab'
