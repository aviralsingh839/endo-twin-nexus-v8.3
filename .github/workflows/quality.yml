name: ENDO-TWIN V8.4 Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install scientific/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src disease_models database apps tests
      - name: Run test suite
        run: pytest -q tests
      - name: Run architecture acceptance
        run: python apps/main/main_app.py


  model-training:
    name: Train and verify PCOS model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Train reproducible clinical model
        working-directory: chrono_pcos_project V8
        run: |
          python scripts/train_pcos_risk_model.py             --csv ../data/public/PCOS_data.csv             --out models/pcos_risk_model.joblib
      - name: Verify model bundle
        working-directory: chrono_pcos_project V8
        run: |
          python - <<'PY'
          import joblib
          from pathlib import Path
          p = Path("models/pcos_risk_model.joblib")
          assert p.exists() and p.stat().st_size > 1000
          bundle = joblib.load(p)
          assert "model" in bundle and "feature_names" in bundle and "meta" in bundle
          assert bundle["target"].lower().startswith("pcos")
          assert bundle["meta"]["n_real_rows"] >= 500
          print("MODEL_BUNDLE_OK")
          print(bundle["meta"])
          PY

  android-patient:
    name: Patient APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show Gradle toolchain
        working-directory: android/patient
        run: ./gradlew --version

      - name: Build patient debug APK
        working-directory: android/patient
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: endo-twin-patient-debug
          path: android/patient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-doctor:
    name: Doctor APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show Gradle toolchain
        working-directory: android/doctor
        run: ./gradlew --version

      - name: Build doctor debug APK
        working-directory: android/doctor
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Upload doctor APK
        uses: actions/upload-artifact@v4
        with:
          name: endo-twin-doctor-debug
          path: android/doctor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14