name: ENDO-TWIN V8.4 Quality Gate

on:
  push:
    branches: ["main", "v8.4-perfection-pass", "**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install scientific/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src disease_models database apps tests
      - name: Run test suite
        run: pytest -q tests
      - name: Run architecture acceptance
        run: python apps/main/main_app.py

  android-patient:
    name: Patient APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build patient debug APK
        working-directory: android/patient
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: endo-twin-patient-debug
          path: android/patient/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-doctor:
    name: Doctor APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build doctor debug APK
        working-directory: android/doctor
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload doctor APK
        uses: actions/upload-artifact@v4
        with:
          name: endo-twin-doctor-debug
          path: android/doctor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
